<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreshFold | Laundry Marketplace Prototype</title>
<style>
:root{font:15px system-ui,sans-serif;color:#17372c;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}header{background:#14382d;color:white;padding:19px 6%;display:flex;align-items:center;justify-content:space-between;gap:10px}header b{font-size:25px}nav{display:flex;gap:7px}nav button{border:0;border-radius:9px;padding:11px;background:#245444;color:white}nav button.active{background:#cfee9d;color:#204732}main{max-width:1150px;margin:auto;padding:25px}h1{font-size:31px;margin:15px 0}h2{font-size:20px}.hero{background:#deeee3;padding:32px;border-radius:17px;margin-bottom:23px}section{margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid #e0e8e1;border-radius:15px;padding:20px}.card h3{margin:5px 0}small,.muted{color:#638374}.btn{background:#187352;color:white;border:0;border-radius:9px;padding:12px 16px;font-weight:700}.soft{background:#e9f6ec;color:#1b6046;border:0;border-radius:9px;padding:11px}.row{display:flex;align-items:center;gap:11px;flex-wrap:wrap}.space{justify-content:space-between}.tag{background:#e0f4e6;color:#1d7252;border-radius:30px;padding:6px 10px;font-size:12px}.item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0ed;padding:13px 0}.qty{display:flex;gap:12px;align-items:center}.qty button{border:0;background:#eaf5ed;border-radius:7px;width:30px;height:30px}.field{display:grid;gap:6px;margin:15px 0}input,textarea,select{border:1px solid #cbded2;border-radius:9px;padding:12px;background:white;max-width:100%}.field input,.field textarea{width:100%}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:15px}.order{background:#fff;border:1px solid #e0e8e1;border-radius:11px;padding:15px;margin:10px 0}.status{font-weight:800;color:#226849}.warn{background:#fff5d8;padding:11px 13px;border-radius:9px;font-size:12px;color:#755b1b}.summary{display:flex;justify-content:space-between;margin:13px 0}.empty{padding:36px;text-align:center;color:#638374;border:1px dashed #c3d8c7;border-radius:12px}.categories{display:flex;gap:8px;flex-wrap:wrap}.categories button{padding:13px;border:1px solid #d4e3d7;background:white;border-radius:10px}.categories button.chosen{border-color:#187352;background:#e5f4e9}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpis .card b{font-size:32px}footer{text-align:center;color:#698578;padding:35px;font-size:12px}@media(max-width:700px){header{display:block}nav{margin-top:12px}main{padding:15px}.grid,.two,.kpis{grid-template-columns:1fr}.hero{padding:22px}}
</style>
<header><b>✳ FreshFold</b><nav><button data-view="customer" class="active">Customer</button><button data-view="partner">Laundry Partner</button><button data-view="admin">Admin</button></nav></header>
<main id="app"></main><footer>Demo only · Sample Aurangabad shops and distances · Local browser storage · No real GPS or payments</footer>
<script>
'use strict';
const shops=[
{id:'a',name:'Sparkle Laundry Co.',area:'CIDCO',distance:1.8,rating:4.8,pickup:true,express:true,price:{iron:[12,18,45],wash:[35,50,110],dry:[90,120,280]}},
{id:'b',name:'The Iron Studio',area:'Jalna Road',distance:3.2,rating:4.6,pickup:true,express:false,price:{iron:[10,15,40]}},
{id:'c',name:'White Cloud Cleaners',area:'Garkheda',distance:4.5,rating:4.9,pickup:false,express:true,price:{iron:[16,22,55],wash:[32,45,110],dry:[100,130,300]}}];
const items=['Shirt / T-shirt','Trousers / Jeans','Saree'], services={iron:'Ironing',wash:'Wash & Fold',dry:'Dry Cleaning'};
let orders;try{orders=JSON.parse(localStorage.getItem('freshfold-orders')||'[]');if(!Array.isArray(orders))orders=[]}catch{orders=[]}
let view='customer',service='iron',selected=null,counts=[0,0,0],urgent=false,method='pickup',partnerId='a',filterPickup=false,filterExpress=false;
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₹'+n;
function persist(){localStorage.setItem('freshfold-orders',JSON.stringify(orders))}
function amounts(){const p=shops.find(s=>s.id===selected),ps=p?.price[service]||[];const base=counts.reduce((t,q,i)=>t+q*(ps[i]||0),0),delivery=method==='pickup'&&base?30:0,priority=urgent&&base?Math.ceil(base*.25):0;return {base,delivery,priority,total:base+delivery+priority,count:counts.reduce((a,b)=>a+b,0)}}
const stages=['Requested','Accepted','Picked up','Processing','Ready for delivery','Out for delivery','Completed'];
function orderHTML(o,role){const next=stages[stages.indexOf(o.status)+1];return '<div class="order"><div class="row space"><b>'+esc(o.id)+' · '+esc(shops.find(p=>p.id===o.shop)?.name)+'</b><span class="tag">'+esc(o.status)+'</span></div><p class="muted">'+esc(o.service)+' · '+o.count+' clothes · '+esc(o.customer)+'</p><p>'+esc(o.address)+'</p><div class="row space"><b>'+money(o.total)+'</b><small>Not charged (demo)</small></div>'+(role==='partner'&&next?'<button class="btn" data-progress="'+esc(o.id)+'">'+(o.status==='Requested'?'Accept':'Mark '+next)+'</button>':'')+'</div>'}
function home(){const filtered=shops.filter(p=>p.price[service]&&(!filterPickup||p.pickup)&&(!filterExpress||p.express));app.innerHTML='<div class="hero"><span class="tag">HYPERLOCAL LAUNDRY MARKETPLACE</span><h1>Your laundry, done right.</h1><p>Discover nearby services, compare prices, and book clothes care in minutes.</p></div><section><h2>Choose a service</h2><div class="categories">'+Object.entries(services).map(([k,v])=>'<button class="'+(service===k?'chosen':'')+'" data-service="'+k+'">'+esc(v)+'</button>').join('')+'</div></section><section><div class="row space"><h2>Available laundry partners</h2><div class="row"><label><input type="checkbox" id="pickupFilter" '+(filterPickup?'checked':'')+'> Pickup</label><label><input type="checkbox" id="expressFilter" '+(filterExpress?'checked':'')+'> Express</label></div></div><div class="grid">'+filtered.map(p=>'<article class="card"><div style="font-size:44px">🧺</div><h3>'+esc(p.name)+'</h3><small>📍 '+esc(p.area)+', Aurangabad · '+p.distance+' km</small><p>⭐ '+p.rating+' · '+(p.pickup?'Pickup available':'Self-drop')+' · '+(p.express?'Express available':'Standard only')+'</p><div class="row space"><b>From '+money(Math.min(...p.price[service]))+'</b><button class="btn" data-shop="'+p.id+'">Book now →</button></div></article>').join('')+'</div></section><section><h2>Your orders</h2>'+(orders.length?orders.slice().reverse().map(o=>orderHTML(o,'customer')).join(''):'<div class="empty">No orders yet. Start with a service above.</div>')+'</section>'}
function booking(){const p=shops.find(s=>s.id===selected),a=amounts();app.innerHTML='<button class="soft" id="back">← Back</button><h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.area)+' · '+p.distance+' km · ⭐ '+p.rating+'</p><div class="two"><div class="card"><h2>Select clothes for '+esc(services[service])+'</h2>'+items.map((x,i)=>'<div class="item"><div><b>'+esc(x)+'</b><br><small>'+money(p.price[service][i])+' / item</small></div><div class="qty"><button data-qty="'+i+'" data-delta="-1">−</button><b>'+counts[i]+'</b><button data-qty="'+i+'" data-delta="1">+</button></div></div>').join('')+'<label class="field">Customer name<input id="name" placeholder="Your name" maxlength="80"></label><label class="field">Pickup / drop address<textarea id="address" maxlength="300" placeholder="House, street and landmark"></textarea></label><div class="row"><label><input type="radio" name="method" value="pickup" '+(method==='pickup'?'checked':'')+' '+(p.pickup?'':'disabled')+'> Doorstep pickup</label><label><input type="radio" name="method" value="drop" '+(method==='drop'?'checked':'')+'> Self-drop</label></div><p><label><input type="checkbox" id="urgent" '+(urgent?'checked':'')+' '+(p.express?'':'disabled')+'> Express (+25% service charge)</label></p><label class="field">Garment photos (demo, not uploaded)<input type="file" accept="image/*"></label></div><div class="card"><h2>Price estimate</h2><div class="summary"><span>'+a.count+' garments</span><b>'+money(a.base)+'</b></div><div class="summary"><span>Pickup & delivery</span><b>'+money(a.delivery)+'</b></div><div class="summary"><span>Priority</span><b>'+money(a.priority)+'</b></div><hr><div class="summary"><strong>Total estimate</strong><strong>'+money(a.total)+'</strong></div><p class="warn">Sample prices only. Real billing and payment integration are not connected.</p><button id="place" class="btn" '+(!a.count?'disabled':'')+'>Place demo order</button></div></div>'}
function partner(){let p=shops.find(x=>x.id===partnerId);app.innerHTML='<h1>Partner workspace</h1><p class="warn">Demo partner mode. Authentication and access controls are not active.</p><div class="row">'+shops.map(s=>'<button class="'+(partnerId===s.id?'btn':'soft')+'" data-partner="'+s.id+'">'+esc(s.name)+'</button>').join('')+'</div><h2>Orders for '+esc(p.name)+'</h2>'+(orders.some(o=>o.shop===p.id)?orders.filter(o=>o.shop===p.id).slice().reverse().map(o=>orderHTML(o,'partner')).join(''):'<div class="empty">No assigned orders. Place a customer order to see one here.</div>')}
function admin(){let completed=orders.filter(o=>o.status==='Completed').length;app.innerHTML='<h1>Marketplace admin</h1><p class="warn">Demo only. No live users, payment transactions, or operational metrics.</p><div class="kpis"><div class="card"><small>Total orders</small><br><b>'+orders.length+'</b></div><div class="card"><small>Completed</small><br><b>'+completed+'</b></div><div class="card"><small>Order value (demo)</small><br><b>'+money(orders.reduce((a,o)=>a+o.total,0))+'</b></div></div><h2>All orders</h2>'+(orders.length?orders.slice().reverse().map(o=>orderHTML(o,'admin')).join(''):'<div class="empty">No marketplace activity yet.</div>')+'<p><button class="soft" id="reset">Reset local demo data</button></p>'}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='customer')selected?booking():home();else if(view==='partner')partner();else admin()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;selected=null;render()}else if(b.dataset.service){service=b.dataset.service;render()}else if(b.dataset.shop){selected=b.dataset.shop;counts=[0,0,0];urgent=false;method=shops.find(x=>x.id===selected).pickup?'pickup':'drop';render()}else if(b.dataset.qty!==undefined){const name=document.getElementById('name')?.value||'',addr=document.getElementById('address')?.value||'';counts[+b.dataset.qty]=Math.max(0,counts[+b.dataset.qty]+Number(b.dataset.delta));render();document.getElementById('name').value=name;document.getElementById('address').value=addr}else if(b.id==='back'){selected=null;render()}else if(b.id==='place'){const name=document.getElementById('name').value.trim(),addr=document.getElementById('address').value.trim(),a=amounts();if(name.length<2||addr.length<8||!a.count){alert('Enter your name, address, and at least one garment');return}orders.push({id:'FF'+Date.now().toString().slice(-8),shop:selected,service:services[service],count:a.count,customer:name,address:addr,total:a.total,status:'Requested'});persist();selected=null;render();alert('Demo order created. Open Laundry Partner to process it.') }else if(b.dataset.partner){partnerId=b.dataset.partner;render()}else if(b.dataset.progress){let o=orders.find(x=>x.id===b.dataset.progress);if(o){let i=stages.indexOf(o.status);if(i>=0&&i<stages.length-1){o.status=stages[i+1];persist();render()}}}else if(b.id==='reset'&&confirm('Erase all demo orders from this browser?')){orders=[];persist();render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pickupFilter'){filterPickup=t.checked;render()}if(t.id==='expressFilter'){filterExpress=t.checked;render()}if(t.id==='urgent'){urgent=t.checked;const name=document.getElementById('name')?.value||'',addr=document.getElementById('address')?.value||'';render();document.getElementById('name').value=name;document.getElementById('address').value=addr}if(t.name==='method'){method=t.value;const name=document.getElementById('name')?.value||'',addr=document.getElementById('address')?.value||'';render();document.getElementById('name').value=name;document.getElementById('address').value=addr}});
render();
</script></html>
